ServerName localhost
PassEnv CI_ENV

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/blog>
        AllowOverride All
        AcceptPathInfo On
    </Directory>

    # Preserve CI's private-directory protections independently of .htaccess.
    <Directory /var/www/html/blog/application>
        Require all denied
    </Directory>
    <Directory /var/www/html/blog/system>
        Require all denied
    </Directory>
    <DirectoryMatch "^/var/www/html/blog/(\.git|\.certs|docker|chat-server|node_modules|docs|scripts)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)\.(sql|dump|env|pem|key|tar|tgz)(\..*)?$">
        Require all denied
    </FilesMatch>
    <Directory /var/www/html/blog/uploads>
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Apache 2.4.47+ handles both HTTP polling and WebSocket upgrades here.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass /socket.io/ http://chat:3000/socket.io/ upgrade=websocket timeout=60
    ProxyPassReverse /socket.io/ http://chat:3000/socket.io/
</VirtualHost>
